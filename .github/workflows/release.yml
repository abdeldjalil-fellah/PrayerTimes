name: Build and Release Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 46.1.19)'
        required: true
      version_code:
        description: 'Version Code (e.g. 20240725)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease
      env:
        VERSION_NAME: ${{ github.event.inputs.version_name }}
        VERSION_CODE: ${{ github.event.inputs.version_code }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download APK from build
      uses: actions/download-artifact@v4
      with:
        name: app-release

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.event.inputs.version_name }}
        release_name: Release ${{ github.event.inputs.version_name }}
        draft: false
        prerelease: false

    - name: Upload Release APK
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./app-release-unsigned.apk
        asset_name: app-release-${{ github.event.inputs.version_name }}.apk
        asset_content_type: application/vnd.android.package-archive
