name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 46.1.19)'
        required: true
      version_code:
        description: 'Version Code (e.g. 20240725)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with: 
        ref: master

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"
        cache: gradle

    - name: Build Release APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease -PversionName=${{ github.event.inputs.version_name }} -PversionCode=${{ github.event.inputs.version_code }}
        find . -type f -name "*.apk"

    - name: Sign APK
      run: |
        keytool -genkeypair -noprompt -v -dname "CN=prayertimes.jalil, OU=Jalil, O=Jalil, L=Algiers, ST=Algiers, C=DZ" -keystore keystore.jks -keyalg RSA -keysize 2048 -validity 3650 -alias alias1 -storepass storepass1 -keypass keypass1
        jarsigner -keystore keystore.jks -storepass storepass1 -keypass keypass1 -sigalg SHA256withRSA -digestalg SHA-256 app/build/outputs/apk/release/PrayerTimes-${{ github.event.inputs.version_code }}.apk alias1
          
    - name: Create Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: app/build/outputs/apk/release/PrayerTimes-${{ github.event.inputs.version_code }}.apk
        asset_name: PrayerTimes-${{ github.event.inputs.version_code }}.apk
        tag: v${{ github.event.inputs.version_name }}
        release_name: v${{ github.event.inputs.version_name }}
